[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cipher-wallet-core"
version = "0.1.0a2"
description = "Public Litecoin Testnet gateway contracts"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Connor Hunter" }]
dependencies = [
  "pydantic>=2.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cipher_wallet_core"]
