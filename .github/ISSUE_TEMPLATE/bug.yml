name: Bug
description: Report a reproducible Cipher Wallet problem.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include recovery phrases, private keys, WIF values, wallet backups, credentials, Testnet funds, or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can it be reproduced?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Browser client
        - FastAPI gateway
        - Gateway contracts
        - AWS infrastructure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
