name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cipher-wallet-ci
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: uv sync --all-groups --locked
      - run: bun run naming:check
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        run: bun scripts/change-naming.ts --pull-request-title
        env:
          CIPHER_WALLET_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
      - name: Require linked issue
        if: github.event_name == 'pull_request'
        run: bun scripts/issue-link.ts --pull-request-body
        env:
          CIPHER_WALLET_PULL_REQUEST_AUTHOR: ${{ github.event.pull_request.user.login }}
          CIPHER_WALLET_PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
      - run: bun run audit
      - run: bun run version:check
      - run: bun run format:check
      - run: bun run lint:ts
      - run: bun run typecheck:ts
      - name: Test project scripts
        run: bun run test:scripts
      - name: Build browser client
        run: bun run build:web
      - name: Build changelog artifacts
        run: bun run changelog:build
      - name: Enforce TypeScript coverage at 95%
        run: bun run coverage:typescript
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Enforce Python coverage at 95%
        run: bun run coverage:python
